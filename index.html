<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>EOS Web</title>
    <meta name="description" content="EOS – Einfache objektorientierte Sprache, im Browser und auf dem iPad">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151922" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EOS">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./eos.webmanifest">
    <link rel="icon" href="./eos-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./eos-icon-180.png">
    <script>
        // Theme so früh wie möglich setzen, damit nichts aufblitzt
        try {
            var t = localStorage.getItem("eos.theme") || "auto";
            document.documentElement.dataset.theme = t;
            document.documentElement.dataset.effective = t == "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        } catch (e) { }
    </script>
    <script type="module" src="/src/app/main.ts"></script>
</head>

<body>
    <div id="eos-app" class="jp-app" aria-busy="true">
        <div class="jp-boot">EOS wird geladen …</div>
    </div>
</body>

</html>
